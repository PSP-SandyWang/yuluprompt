<title>廣告視覺台</title>
<meta name="description" content="產品視覺與廣告 banner 的提示詞組裝：靜態首幀到動態影片，支援 GPT Image 2、Nano Banana 2 與 I2V。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --ink:#1c1a17;--body:#3a3630;--muted:#6b6660;--faint:#9a938a;
  --paper:#f7f6f4;--surface:#fff;--surface-2:#f1efea;--field:#fff;
  --line:#e3dfd9;--line-2:#d2ccc2;
  --img:#b8651a;--img-soft:#fbefe1;--vid:#157c7c;--vid-soft:#e2f2f1;--neu:#5d574f;--warn:#b23b2e;
  --shadow:0 1px 2px rgba(28,26,23,.05),0 10px 28px rgba(28,26,23,.07);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --accent:#b8651a;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f4f1ec;--body:#d8d2c9;--muted:#a09992;--faint:#746d65;
  --paper:#161513;--surface:#201e1b;--surface-2:#282521;--field:#1a1816;
  --line:#332f2a;--line-2:#453f38;
  --img:#e08b3a;--img-soft:#2e2318;--vid:#3fb0ae;--vid-soft:#152a2a;--neu:#9c948a;--warn:#e8705f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);--accent:#e08b3a;}}
:root[data-theme="dark"]{
  --ink:#f4f1ec;--body:#d8d2c9;--muted:#a09992;--faint:#746d65;
  --paper:#161513;--surface:#201e1b;--surface-2:#282521;--field:#1a1816;
  --line:#332f2a;--line-2:#453f38;
  --img:#e08b3a;--img-soft:#2e2318;--vid:#3fb0ae;--vid-soft:#152a2a;--neu:#9c948a;--warn:#e8705f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);--accent:#e08b3a;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,textarea{font-family:inherit;font-size:inherit}

.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1220px;margin:0 auto;padding:13px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand .mk{width:11px;height:11px;border-radius:3px;background:var(--accent)}
.brand h1{font-size:15px;font-weight:900;color:var(--ink)}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg.lang button{padding:7px 11px;font-family:var(--mono);font-size:11.5px}

.main{max-width:1220px;margin:0 auto;padding:22px 20px 80px;display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:1000px){.main{grid-template-columns:1fr 430px;align-items:start}}

.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}
.gtoggle{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;padding:0;cursor:pointer;text-align:left}
.gtoggle h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gchev{margin-left:auto;color:var(--faint);font-size:11px}
.group[data-open="0"] .gbody{display:none}
.group[data-open="0"] .gchev{transform:rotate(-90deg)}
.gnote{font-size:12px;color:var(--faint);margin:4px 0 2px}
.f{margin-top:15px}
.f label{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
.f label .tip{font-weight:400;font-size:11.5px;color:var(--faint)}
.f input,.f textarea{width:100%;background:var(--field);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;color:var(--ink);outline:none}
.f input:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.f textarea{resize:vertical;min-height:56px;line-height:1.6}
.bank{margin-top:8px}
.bankToggle{font-family:var(--mono);font-size:10.5px;color:var(--faint);background:transparent;border:1px dashed var(--line-2);border-radius:6px;padding:4px 10px;cursor:pointer}
.bankToggle:hover{color:var(--accent);border-color:var(--accent)}
.bank.col[data-open="0"] .brows{display:none}
.brow{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-top:1px dashed var(--line)}
.brow:first-child{border-top:0}
.blabel{font-family:var(--mono);font-size:10px;color:var(--faint);min-width:56px;padding-top:5px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chip{position:relative;font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.chip::after{content:'';position:absolute;left:0;bottom:calc(100% + 7px);background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:11.5px;padding:7px 10px;border-radius:7px;width:max-content;max-width:300px;line-height:1.55;white-space:normal;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.22)}
:root[data-lang="cn"] .chip::after{content:attr(data-en)}
:root[data-lang="en"] .chip::after{content:attr(data-cn)}
.chip:hover::after{opacity:1}
.chip.mine{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.chip .x{margin-left:5px;opacity:.5}
.addw{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:6px;border:1px dashed var(--line-2);background:transparent;color:var(--faint);cursor:pointer}
.addw:hover{color:var(--accent);border-color:var(--accent)}
.only{display:none}.only.on{display:block}

.out-wrap{position:sticky;top:76px}
.out{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.out-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.out-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.out-h .name{font-weight:700;color:var(--ink);font-size:13.5px}
.out-h .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.out-b{padding:16px;max-height:52vh;overflow:auto}
#result{font-family:var(--mono);font-size:12.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word;color:var(--ink);margin:0}
.empty{color:var(--faint)}
.out-f{display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
.btn{font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.guide{margin-top:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.guide .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.guide p{font-size:12.5px;color:var(--muted);line-height:1.65}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand"><span class="mk"></span>
      <div><h1>廣告視覺台</h1><div class="sub">product visual · banner · first frame → motion</div></div></div>
    <a id="home" href="index.html" style="font-family:var(--mono);font-size:11.5px;text-decoration:none;color:var(--muted);border:1px solid var(--line-2);padding:6px 12px;border-radius:999px">← 目錄</a>
    <div class="spacer"></div>
    <div class="seg" id="tabs" role="group" aria-label="輸出">
      <button data-k="gpt" aria-pressed="true">GPT Image 2</button>
      <button data-k="nb2" aria-pressed="false">Nano Banana 2</button>
      <button data-k="i2v" aria-pressed="false">影片 I2V</button>
    </div>
    <div class="seg lang" id="langTabs" role="group" aria-label="語言">
      <button data-l="cn" aria-pressed="true">中</button>
      <button data-l="en" aria-pressed="false">EN</button>
    </div>
  </div>
</div>

<div class="main">
  <div id="form"></div>
  <div class="out-wrap">
    <div class="out">
      <div class="out-h"><span class="dot"></span><span class="name" id="outName">GPT Image 2</span><span class="cnt" id="outCnt">0 字</span></div>
      <div class="out-b"><pre id="result" class="empty">開始填左邊的欄位，這裡會即時組出提示詞。</pre></div>
      <div class="out-f">
        <button class="btn pri" id="copy">複製</button>
        <button class="btn" id="demo">填入範例</button>
        <button class="btn" id="clear">清空</button>
      </div>
    </div>
    <div class="guide"><div class="lbl" id="gLbl"></div><p id="gTxt"></p></div>
    <div class="guide"><div class="lbl">工作流建議</div>
      <p><strong>先做首幀、再動起來。</strong>影片模型做不好文字，所以把標題與版面在靜態階段用 GPT Image 2 / Nano Banana 2 做到位，再切到「影片 I2V」只描述要動什麼。首幀越乾淨（主體與背景分離清楚），動起來越穩。</p></div>
  </div>
</div>

const IDS=CFG.flatMap(g=>g.fields.map(f=>f.id));
const $=id=>document.getElementById(id);
const v=id=>($(id)?.value||'').trim();
let mine={}; try{mine=JSON.parse(localStorage.getItem('av_words')||'{}');}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(w){return typeof w==='string'?{cn:w,en:w}:w;}
function bankKey(f,l){return f+'::'+l;}
function chipHTML(w,m){const o=norm(w);return `<span class="chip${m?' mine':''}" data-cn="${esc(o.cn)}" data-en="${esc(o.en)}">${esc(o.cn)}${m?`<span class="x" data-del="${esc(o.cn)}">×</span>`:''}</span>`;}
function banksHTML(fid,banks){
  const total=banks.reduce((n,b)=>n+b.w.length,0), big=total>28;
  return `<div class="bank${big?' col':''}" data-open="${big?'0':'1'}">
   ${big?`<button class="bankToggle" type="button">詞庫 · ${total} 詞 ▾</button>`:''}
   <div class="brows">${banks.map(b=>{
     const key=bankKey(fid,b.l), custom=mine[key]||[];
     return `<div class="brow"><span class="blabel">${esc(b.l)}</span><div class="chips" data-for="${fid}" data-mode="${b.m}" data-key="${key}">
       ${b.w.map(w=>chipHTML(w,0)).join('')}${custom.map(w=>chipHTML(w,1)).join('')}
       <button class="addw" data-add="${key}">＋</button></div></div>`;}).join('')}</div></div>`;
}
function renderForm(){
  $('form').innerHTML=CFG.map(g=>`<div class="group ${g.only?('only '+g.only):''}" data-open="${g.open===false?'0':'1'}">
    <button class="gtoggle" type="button"><h2>${esc(g.g)}</h2><span class="gchev">▾</span></button>
    <div class="gbody"><div class="gnote">${esc(g.note||'')}</div>
    ${g.fields.map(f=>`<div class="${f.only?('f only '+f.only):'f'}">
      <label>${esc(f.label)}${f.tip?`<span class="tip">${esc(f.tip)}</span>`:''}</label>
      ${f.big?`<textarea id="${f.id}" placeholder="${esc(f.ph||'')}"></textarea>`:`<input id="${f.id}" placeholder="${esc(f.ph||'')}">`}
      ${f.banks?banksHTML(f.id,f.banks):''}</div>`).join('')}
    </div></div>`).join('');
  bind();
}
function bind(){
  IDS.forEach(i=>$(i)?.addEventListener('input',render));
  document.querySelectorAll('.gtoggle').forEach(b=>b.addEventListener('click',()=>{const g=b.closest('.group');g.dataset.open=g.dataset.open==='1'?'0':'1';}));
  document.querySelectorAll('.bankToggle').forEach(b=>b.addEventListener('click',()=>{const k=b.closest('.bank');const o=k.dataset.open==='1';k.dataset.open=o?'0':'1';b.textContent=b.textContent.replace(o?'▴':'▾',o?'▾':'▴');}));
  document.querySelectorAll('.chips').forEach(box=>box.addEventListener('click',e=>{
    const del=e.target.closest('[data-del]');
    if(del){const k=box.dataset.key;mine[k]=(mine[k]||[]).filter(x=>x!==del.dataset.del);saveW();renderForm();indexWords();restore();setTool(tool);return;}
    const add=e.target.closest('[data-add]');
    if(add){const w=prompt('加一個自己的詞到「'+box.dataset.key.split('::')[1]+'」：');if(w&&w.trim()){const k=box.dataset.key;mine[k]=[...(mine[k]||[]),w.trim()];saveW();renderForm();indexWords();restore();setTool(tool);}return;}
    const c=e.target.closest('.chip'); if(!c)return;
    const el=$(box.dataset.for); if(!el)return;
    const val=(lang==='en'&&c.dataset.en)?c.dataset.en:c.dataset.cn;
    const sepc=lang==='en'?', ':'、';
    if(el.value.includes(val)){
      el.value=el.value.split(val).join('').replace(/、\s*、/g,'、').replace(/,\s*,/g,', ')
        .replace(/^[、,\s]+/,'').replace(/[、,\s]+$/,'');
    }else{
      el.value=el.value.trim()?el.value.trim().replace(/[、,]$/,'')+sepc+val:val;
    }
    render(); el.focus();
  }));
}

function saveV(){try{localStorage.setItem('av',JSON.stringify(Object.fromEntries(IDS.map(i=>[i,v(i)]))));}catch(e){}}

let CN2EN={},EN2CN={},KC=[],KE=[];
function indexWords(){CN2EN={};EN2CN={};
  const add=w=>{const o=norm(w);if(o.cn&&o.en&&o.cn!==o.en){CN2EN[o.cn]=o.en;EN2CN[o.en]=o.cn;}};
  CFG.forEach(g=>g.fields.forEach(f=>(f.banks||[]).forEach(b=>b.w.forEach(add))));
  KC=Object.keys(CN2EN).sort((a,b)=>b.length-a.length);KE=Object.keys(EN2CN).sort((a,b)=>b.length-a.length);}
function convert(to){const map=to==='en'?CN2EN:EN2CN,keys=to==='en'?KC:KE;
  IDS.forEach(id=>{const el=$(id);if(!el||!el.value)return;let s=el.value;
    for(const k of keys){if(s.indexOf(k)>-1)s=s.split(k).join(map[k]);}
    if(to==='en')s=s.replace(/、/g,', ').replace(/，/g,', ');el.value=s;});}

const EN=()=>lang==='en';
const J=(a,s)=>a.filter(x=>x&&String(x).trim()).join(s);
const NAMES={gpt:'GPT Image 2',nb2:'Nano Banana 2',i2v:'影片 I2V'};
const GUIDE={
 gpt:['GPT Image 2','把它當成交辦一張製作單：用途、文字、構圖、限制都講清楚。圖上文字用引號照抄、字數壓短，並加「不要多餘文字、不要重複文字」。'],
 nb2:['Nano Banana 2','最強的是多圖合成與編輯，最多可帶 14 張參考圖。把產品去背圖、背景參考、版型參考列進「參考圖清單」，再說明每張的角色與要保留什麼。'],
 i2v:['影片 I2V','先有首幀再動起來。只描述「要動什麼、怎麼動、幾秒」，一次 1–2 個主要動作。文字請留在首幀，不要讓影片模型重寫。']
};

function build(){
  const o={}; IDS.forEach(k=>o[k]=v(k));
  const sep=EN()?', ':'、'; const t=(cn,en)=>EN()?en:cn;
  const visual=J([o.present,o.cam,o.stage,o.light,o.color,o.style],sep);
  const human=J([o.model,o.ethn,o.mint],sep);
  const txt=[]; if(o.h1)txt.push((EN()?'headline ':'主標 ')+'"'+o.h1+'"');
  if(o.h2)txt.push((EN()?'subhead ':'副標 ')+'"'+o.h2+'"');
  if(o.cta)txt.push((EN()?'button ':'按鈕 ')+'"'+o.cta+'"');
  if(o.price)txt.push((EN()?'badge ':'標籤 ')+'"'+o.price+'"');
  if(o.sell)txt.push((EN()?'benefit ':'賣點 ')+'"'+o.sell+'"');
  const typo=J([o.tstyle,o.font],sep);

  if(tool==='i2v'){
    const L=[];
    L.push(t('以這張首幀圖為基礎製作影片。','Animate this still image as the first frame.'));
    if(o.dur)L.push(t('長度與結構：','Duration & structure: ')+o.dur);
    if(o.product)L.push(t('主體：','Subject: ')+o.product);
    if(human)L.push(t('人物：','People: ')+human);
    if(o.motion)L.push(t('動作與鏡頭：','Motion & camera: ')+o.motion);
    if(o.lastf)L.push(t('結尾：','Ending: ')+o.lastf);
    if(o.lock)L.push(t('【必須保持不變】','MUST REMAIN UNCHANGED: ')+o.lock);
    if(o.neg)L.push(t('【不要出現】','DO NOT INCLUDE: ')+o.neg);
    L.push(t('保持產品外觀、配色與構圖不變；圖上文字維持靜止清晰，不要重寫或變形。',
             'Keep the product appearance, colours and composition unchanged; keep any on-image text static, legible and unaltered.'));
    return L.join('\n');
  }

  if(tool==='nb2'){
    const L=[];
    L.push(t('依下列參考圖與說明合成一張廣告視覺。','Compose one advertising visual from the reference images below.'));
    if(o.refs)L.push(t('參考圖：','Reference images: ')+'\n'+o.refs);
    if(o.size)L.push(t('尺寸：','Output size: ')+o.size);
    if(o.season)L.push(t('檔期語境：','Campaign context: ')+o.season);
    if(o.product)L.push(t('產品：','Product: ')+J([o.product,o.pmat],sep));
    if(human)L.push(t('人物：','People: ')+human);
    if(visual)L.push(t('視覺：','Visual: ')+visual);
    if(o.scale)L.push(t('畫面占比：','Framing weight: ')+o.scale);
    if(txt.length)L.push(t('文字（照抄，不要多餘或重複文字）：','Exact text (verbatim, no extra or duplicate text): ')+txt.join(sep)+(typo?(' — '+typo):''));
    if(o.layout)L.push(t('版面：','Layout: ')+o.layout);
    if(o.cutout)L.push(t('輸出：','Output: ')+o.cutout);
    if(o.lock)L.push(t('【必須保持不變】','MUST REMAIN UNCHANGED: ')+o.lock);
    if(o.quality)L.push(t('畫質：','Quality: ')+o.quality);
    if(o.neg)L.push(t('【不要出現】','DO NOT INCLUDE: ')+o.neg);
    L.push(t('務必保留參考產品的造型、比例、配色與標誌，不要重新設計。',
             'Preserve the referenced product shape, proportions, colours and logo exactly; do not redesign it.'));
    return L.join('\n');
  }

  const L=[];
  L.push(t('製作一張廣告視覺','Create an advertising visual')+(o.goal?t('，用途：'+o.goal,' for '+o.goal):'')+(o.size?t('，尺寸 '+o.size,', '+o.size):'')+'。');
  if(o.season)L.push(t('檔期語境：','Campaign context: ')+o.season);
  if(o.product)L.push(t('產品：','Product: ')+J([o.product,o.pmat],sep));
  if(human)L.push(t('人物：','People: ')+human);
  if(J([o.present,o.cam],sep))L.push(t('呈現方式與相機：','Presentation & camera: ')+J([o.present,o.cam],sep));
  if(o.scale)L.push(t('畫面占比：','Framing weight: ')+o.scale);
  if(o.stage)L.push(t('舞台與背景：','Set & background: ')+o.stage);
  if(J([o.light,o.color],sep))L.push(t('光線與色彩：','Lighting & colour: ')+J([o.light,o.color],sep));
  if(o.style)L.push(t('風格：','Style: ')+o.style);
  if(txt.length)L.push(t('文字（照抄，不要多餘文字、不要重複文字）：','EXACT TEXT (verbatim, no extra words, no duplicate text): ')+'\n　'+txt.join(sep)+(typo?('\n　'+typo):''));
  if(o.layout)L.push(t('版面與構圖：','Layout & composition: ')+o.layout);
  if(o.cutout)L.push(t('輸出：','Output: ')+o.cutout);
  if(o.lock)L.push(t('【必須保持不變】','MUST REMAIN UNCHANGED: ')+o.lock);
  if(o.quality)L.push(t('畫質：','Quality: ')+o.quality);
  if(o.neg)L.push(t('【不要出現】','DO NOT INCLUDE: ')+o.neg);
  return L.join('\n');
}
function render(){
  const out=build(), el=$('result'), has=IDS.some(i=>v(i));
  el.textContent=has?out:'開始填左邊的欄位，這裡會即時組出提示詞。';
  el.classList.toggle('empty',!has);
  $('outCnt').textContent=(has?out.length:0)+' 字';
  $('outName').textContent=NAMES[tool];
  $('gLbl').textContent=GUIDE[tool][0];$('gTxt').textContent=GUIDE[tool][1];
  saveV();
}
function setTool(k){tool=k;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  const dark=matchMedia('(prefers-color-scheme:dark)').matches||document.documentElement.dataset.theme==='dark';
  document.documentElement.style.setProperty('--accent', k==='i2v'?(dark?'#3fb0ae':'#157c7c'):(dark?'#e08b3a':'#b8651a'));
  document.querySelectorAll('.only').forEach(el=>el.classList.toggle('on',el.classList.contains(k)));
  render();}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.k)));
document.querySelectorAll('#langTabs button').forEach(b=>b.addEventListener('click',()=>{
  if(lang===b.dataset.l)return;lang=b.dataset.l;document.documentElement.dataset.lang=lang;
  document.querySelectorAll('#langTabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  convert(lang);render();}));
