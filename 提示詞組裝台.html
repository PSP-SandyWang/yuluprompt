<title>提示詞組裝台</title>
<meta name="description" content="分層詞庫 × 自訂詞彙，填一次欄位自動組裝成 Krea 2、GPT Image 2、MiniMax H3、標籤式模型各自正確的提示詞。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --ink:#1c1a17; --body:#3a3630; --muted:#6b6660; --faint:#9a938a;
  --paper:#f7f6f4; --surface:#ffffff; --surface-2:#f1efea; --field:#ffffff;
  --line:#e3dfd9; --line-2:#d2ccc2;
  --img:#b8651a; --img-soft:#fbefe1;
  --vid:#157c7c; --vid-soft:#e2f2f1;
  --neutral:#5d574f; --warn:#b23b2e;
  --shadow:0 1px 2px rgba(28,26,23,.05), 0 10px 28px rgba(28,26,23,.07);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --accent:#b8651a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#f4f1ec; --body:#d8d2c9; --muted:#a09992; --faint:#746d65;
    --paper:#161513; --surface:#201e1b; --surface-2:#282521; --field:#1a1816;
    --line:#332f2a; --line-2:#453f38;
    --img:#e08b3a; --img-soft:#2e2318; --vid:#3fb0ae; --vid-soft:#152a2a;
    --neutral:#9c948a; --warn:#e8705f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4);
    --accent:#e08b3a;
  }
}
:root[data-theme="dark"]{
  --ink:#f4f1ec; --body:#d8d2c9; --muted:#a09992; --faint:#746d65;
  --paper:#161513; --surface:#201e1b; --surface-2:#282521; --field:#1a1816;
  --line:#332f2a; --line-2:#453f38;
  --img:#e08b3a; --img-soft:#2e2318; --vid:#3fb0ae; --vid-soft:#152a2a;
  --neutral:#9c948a; --warn:#e8705f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4);
  --accent:#e08b3a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,textarea{font-family:inherit;font-size:inherit}

.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1220px;margin:0 auto;padding:13px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand .mk{width:11px;height:11px;border-radius:3px;background:var(--accent)}
.brand h1{font-size:15px;font-weight:900;color:var(--ink)}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em}
.spacer{flex:1}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}

.main{max-width:1220px;margin:0 auto;padding:24px 20px 80px;display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:980px){.main{grid-template-columns:1fr 420px;align-items:start}}

.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.group > h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.group > .gnote{font-size:12px;color:var(--faint);margin-bottom:6px}
.f{margin-top:16px}
.f label{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
.f label .tip{font-weight:400;font-size:11.5px;color:var(--faint)}
.f input{width:100%;background:var(--field);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;color:var(--ink);outline:none}
.f input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}

/* nested banks */
.bank{margin-top:8px}
.brow{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-top:1px dashed var(--line)}
.brow:first-child{border-top:0}
.blabel{font-family:var(--mono);font-size:10px;color:var(--faint);min-width:52px;padding-top:5px;letter-spacing:.04em;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;transition:.12s;position:relative}
.chip:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.chip::after{content:'';position:absolute;left:0;bottom:calc(100% + 7px);background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:11.5px;font-weight:400;padding:7px 10px;border-radius:7px;width:max-content;max-width:300px;line-height:1.55;white-space:normal;text-align:left;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.22)}
:root[data-lang="cn"] .chip::after{content:attr(data-en)}
:root[data-lang="en"] .chip::after{content:attr(data-cn)}
.chip:hover::after{opacity:1}
.brow:first-child .chip::after{bottom:auto;top:calc(100% + 7px)}
.chip.mine{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.chip .x{margin-left:5px;opacity:.5}
.chip .x:hover{opacity:1}
.addw{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:6px;border:1px dashed var(--line-2);background:transparent;color:var(--faint);cursor:pointer}
.addw:hover{color:var(--accent);border-color:var(--accent)}
.bankToggle{font-family:var(--mono);font-size:10.5px;color:var(--faint);background:transparent;border:1px dashed var(--line-2);border-radius:6px;padding:4px 10px;cursor:pointer;margin-bottom:2px}
.bankToggle:hover{color:var(--accent);border-color:var(--accent)}
.bank.col[data-open="0"] .brows{display:none}
.gtoggle{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;padding:0;cursor:pointer;text-align:left}
.gchev{margin-left:auto;color:var(--faint);font-size:11px;transition:.15s}
.group[data-open="0"] .gbody{display:none}
.group[data-open="0"] .gchev{transform:rotate(-90deg)}
.group[data-open="0"]{padding-bottom:16px}
.tabs.lang button{padding:7px 11px;font-family:var(--mono);font-size:11.5px}
.only{display:none}
.only.on{display:block}
.warnline{font-size:11.5px;color:var(--warn);margin-top:8px;line-height:1.5}

.out-wrap{position:sticky;top:76px}
.out{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.out-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.out-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.out-h .name{font-weight:700;color:var(--ink);font-size:13.5px}
.out-h .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.out-b{padding:16px;max-height:48vh;overflow:auto}
#result{font-family:var(--mono);font-size:12.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word;color:var(--ink);margin:0}
.empty{color:var(--faint)}
.out-f{display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
.btn{font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.guide{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.guide .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.guide p{font-size:12.5px;color:var(--muted);line-height:1.65}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  </div>
</div>

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function bankKey(fid,l){return fid+'::'+l;}

function renderForm(){
  $('form').innerHTML = CFG.map(g=>{
    const cls = g.only ? ('only '+g.only) : '';
    return `<div class="group ${cls}" data-open="${g.open===false?'0':'1'}">
      <button class="gtoggle" type="button"><h2>${esc(g.g)}</h2><span class="gchev">▾</span></button>
      <div class="gbody"><div class="gnote">${esc(g.note||'')}</div>
      ${g.fields.map(f=>{
        const fcls = f.only ? ('f only '+f.only) : 'f';
        return `<div class="${fcls}">
          <label>${esc(f.label)}${f.tip?`<span class="tip">${esc(f.tip)}</span>`:''}</label>
          <input id="${f.id}" placeholder="${esc(f.ph||'')}">
          ${f.banks?banksHTML(f.id,f.banks):''}
        </div>`;
      }).join('')}
      ${g.only==='sd'?'<div class="warnline">提醒：這兩類詞只對 Stable Diffusion 家族有用，換到其他工具時會自動不帶入。</div>':''}
      </div>
    </div>`;
  }).join('');
  bindForm();
}
function norm(w){return typeof w==='string'?{cn:w,en:w}:w;}
function chipHTML(w,isMine){
  const o=norm(w);
  return `<span class="chip${isMine?' mine':''}" data-cn="${esc(o.cn)}" data-en="${esc(o.en)}" >${esc(o.cn)}${isMine?`<span class="x" data-del="${esc(o.cn)}">×</span>`:''}</span>`;
}
function banksHTML(fid,banks){
  const total=banks.reduce((n,b)=>n+b.w.length,0);
  const big=total>28;
  return `<div class="bank${big?' col':''}" data-open="${big?'0':'1'}">
    ${big?`<button class="bankToggle" type="button">詞庫 · ${total} 詞 ▾</button>`:''}
    <div class="brows">${banks.map(b=>bankRow(fid,b)).join('')}</div>
  </div>`;
}
function bankRow(fid,b){
  const key=bankKey(fid,b.l);
  const custom=(mine[key]||[]);
  return `<div class="brow"><span class="blabel">${esc(b.l)}</span><div class="chips" data-for="${fid}" data-mode="${b.m}" data-key="${key}">
    ${b.w.map(w=>chipHTML(w,false)).join('')}
    ${custom.map(w=>chipHTML(w,true)).join('')}
    <button class="addw" data-add="${key}">＋</button>
  </div></div>`;
}
function bindForm(){
  IDS.forEach(i=>$(i)?.addEventListener('input',render));
  document.querySelectorAll('.gtoggle').forEach(b=>b.addEventListener('click',()=>{
    const g=b.closest('.group'); g.dataset.open=g.dataset.open==='1'?'0':'1';
  }));
  document.querySelectorAll('.bankToggle').forEach(b=>b.addEventListener('click',()=>{
    const bank=b.closest('.bank'), open=bank.dataset.open==='1';
    bank.dataset.open=open?'0':'1';
    b.textContent=b.textContent.replace(open?'▴':'▾', open?'▾':'▴');
  }));
  document.querySelectorAll('.chips').forEach(box=>{
    box.addEventListener('click',e=>{
      const del=e.target.closest('[data-del]');
      if(del){
        const key=box.dataset.key, w=del.dataset.del;
        mine[key]=(mine[key]||[]).filter(x=>x!==w);
        save(); renderForm(); restore(); setTool(tool); return;
      }
      const add=e.target.closest('[data-add]');
      if(add){
        const w=prompt('加一個自己的詞到「'+box.dataset.key.split('::')[1]+'」：');
        if(w&&w.trim()){const key=box.dataset.key;mine[key]=[...(mine[key]||[]),w.trim()];save();renderForm();indexWords();restore();setTool(tool);}
        return;
      }
      const chip=e.target.closest('.chip');
      if(!chip)return;
      const el=$(box.dataset.for); if(!el)return;
      const val=(lang==='en'&&chip.dataset.en)?chip.dataset.en:chip.dataset.cn;
      if(box.dataset.mode==='add'&&el.value.trim()){
        if(!el.value.includes(val)) el.value=el.value.trim().replace(/[、,]$/,'')+'、'+val;
      } else el.value=val;
      render(); el.focus();
    });
  });
}
function save(){try{localStorage.setItem('pb_words',JSON.stringify(mine));}catch(e){}}
function saveVals(){try{localStorage.setItem('pb',JSON.stringify(Object.fromEntries(IDS.map(i=>[i,v(i)]))));}catch(e){}}
function restore(){try{const s=JSON.parse(localStorage.getItem('pb')||'{}');Object.entries(s).forEach(([k,val])=>{if($(k)&&val)$(k).value=val;});}catch(e){}}

const GLOSS=[{cn:"二十多歲女性",en:"a woman in her twenties"},{cn:"三十多歲女性",en:"a woman in her thirties"},{cn:"二十多歲男性",en:"a man in his twenties"},{cn:"三十多歲男性",en:"a man in his thirties"},{cn:"女性",en:"woman"},{cn:"男性",en:"man"},{cn:"女人",en:"woman"},{cn:"男人",en:"man"},{cn:"女孩",en:"girl"},{cn:"男孩",en:"boy"},{cn:"少女",en:"teenage girl"},{cn:"少年",en:"teenage boy"},{cn:"老人",en:"elderly person"},{cn:"小孩",en:"child"},{cn:"嬰兒",en:"baby"},{cn:"二十多歲",en:"in their twenties"},{cn:"三十多歲",en:"in their thirties"},{cn:"四十多歲",en:"in their forties"},{cn:"貓",en:"cat"},{cn:"狗",en:"dog"},{cn:"鳥",en:"bird"},{cn:"馬",en:"horse"},{cn:"兔子",en:"rabbit"},{cn:"狐狸",en:"fox"},{cn:"鹿",en:"deer"},{cn:"狼",en:"wolf"},{cn:"蝴蝶",en:"butterfly"},{cn:"魚",en:"fish"},{cn:"花朵",en:"flowers"},{cn:"樹",en:"tree"},{cn:"森林",en:"forest"},{cn:"山",en:"mountains"},{cn:"海",en:"the sea"},{cn:"河",en:"river"},{cn:"天空",en:"sky"},{cn:"雲",en:"clouds"},{cn:"星空",en:"starry sky"},{cn:"月亮",en:"the moon"},{cn:"太陽",en:"the sun"},{cn:"雪",en:"snow"},{cn:"咖啡",en:"coffee"},{cn:"書",en:"a book"},{cn:"手機",en:"a phone"},{cn:"相機",en:"a camera"},{cn:"腳踏車",en:"a bicycle"},{cn:"汽車",en:"a car"},{cn:"窗戶",en:"a window"},{cn:"門",en:"a door"},{cn:"鏡子",en:"a mirror"},{cn:"傘",en:"an umbrella"},{cn:"蛋糕",en:"cake"},{cn:"城市",en:"a city"},{cn:"建築",en:"architecture"},{cn:"房間",en:"a room"},{cn:"街道",en:"a street"},{cn:"橋",en:"a bridge"},{cn:"車站",en:"a station"},{cn:"背影",en:"seen from behind"},{cn:"側臉",en:"in profile"},{cn:"半身",en:"upper body"},{cn:"全身",en:"full body"},{cn:"微笑",en:"smiling"},{cn:"閉眼",en:"eyes closed"},{cn:"回頭",en:"looking back"},{cn:"坐著",en:"sitting"},{cn:"站著",en:"standing"},{cn:"走路",en:"walking"},{cn:"跑步",en:"running"},{cn:"睡覺",en:"sleeping"},{cn:"黑髮",en:"black hair"},{cn:"長髮",en:"long hair"},{cn:"短髮",en:"short hair"}];
let CN2EN={},EN2CN={},LKEYS_CN=[],LKEYS_EN=[];
function indexWords(){
  const add=w=>{const o=norm(w); if(o.cn&&o.en&&o.cn!==o.en){CN2EN[o.cn]=o.en;EN2CN[o.en]=o.cn;}};
  CFG.forEach(g=>g.fields.forEach(f=>(f.banks||[]).forEach(b=>b.w.forEach(add))));
  Object.values(mine).forEach(a=>a.forEach(add));
  GLOSS.forEach(add);
  LKEYS_CN=Object.keys(CN2EN).sort((a,b)=>b.length-a.length);
  LKEYS_EN=Object.keys(EN2CN).sort((a,b)=>b.length-a.length);
}
function convertFields(to){
  const map=to==='en'?CN2EN:EN2CN, keys=to==='en'?LKEYS_CN:LKEYS_EN;
  IDS.forEach(id=>{
    const el=$(id); if(!el||!el.value)return;
    let s=el.value;
    for(const k of keys){ if(s.indexOf(k)>-1) s=s.split(k).join(map[k]); }
    if(to==='en') s=s.replace(/、/g,', ').replace(/，/g,', ');
    el.value=s;
  });
}
const EN=()=>lang==='en';
const T=(cn,en)=>EN()?en:cn;

function build(){
  const o={}; IDS.forEach(k=>o[k]=v(k));
  const sep=EN()?', ':'，';
  const who=J([o.count,o.subject,o.look],sep);
  const person=J([o.body,o.face,o.skin,o.makeup,o.expr],sep);
  const act=J([o.action,o.pose,o.motion],sep);
  const cam=J([o.shot,o.angle,o.comp,o.lens,o.ratio],EN()?', ':'、');

  if(tool==='charsheet'){
    const P_EN={'三視圖':'character turnaround reference sheet, the same character shown from front view, side view and back view, identical proportions, costume, hairstyle and colors across all three views, neutral A-pose, full body, flat even lighting, plain neutral background, orthographic framing with no dramatic perspective',
      '表情表':'character expression sheet, a clean grid of the same character head repeated with neutral, gentle smile, laughing, angry, sad, surprised and embarrassed expressions, identical facial features, hairstyle and colors in every panel, head and shoulders only, flat even lighting, plain neutral background',
      '姿勢表':'character pose sheet, the same character in six different full-body poses, identical costume, proportions and colors in every pose, clear readable silhouettes, flat even lighting, plain neutral background',
      '服裝三視圖':'costume reference sheet, front, side and back views of the same outfit, neutral mannequin pose, flat even lighting, plain background, material, trim and fastening details clearly visible'};
    const P_CN={'三視圖':'角色三視圖設定表，同一個角色的正面、側面、背面三個視角，三視角的比例、服裝、髮型與配色完全一致，中性 A-pose，全身，平均打光，純色留白背景，正投影構圖、不要戲劇性透視',
      '表情表':'角色表情表，同一個角色的頭部以網格排列，依序為無表情、淺笑、大笑、生氣、難過、驚訝、害羞，每一格的五官、髮型與配色完全一致，只到肩膀，平均打光，純色留白背景',
      '姿勢表':'角色姿勢表，同一個角色的六組全身姿勢，每組的服裝、比例與配色完全一致，剪影清楚可辨，平均打光，純色留白背景',
      '服裝三視圖':'服裝設定表，同一套服裝的正面、側面、背面三視圖，中性假人姿勢，平均打光，純背景，材質、滾邊與開合細節清楚可見'};
    const KMAP={'三視圖':'三視圖','character turnaround sheet':'三視圖','表情表':'表情表','expression sheet':'表情表',
      '姿勢表':'姿勢表','pose sheet':'姿勢表','服裝三視圖':'服裝三視圖','costume turnaround sheet':'服裝三視圖'};
    const kind=KMAP[(o.sheettype||'').trim()]||'三視圖';
    const head=EN()?P_EN[kind]:P_CN[kind];
    const bodyline=J([who,o.species,person,o.material,o.style,o.brush,o.consist],sep);
    const tail=EN()?'consistent character identity in every view, no background elements, no props, no text':'每個視角維持同一個角色識別特徵，背景不要有其他元素、道具或文字';
    return J([head, bodyline?((EN()?'Character: ':'角色：')+bodyline):'', tail],'\n');
  }

  if(tool==='blocks'){
    const B=[
      ['STYLE｜畫面風格', J([o.medium,o.style],sep)],
      ['CHARACTER｜角色與數量', J([o.count,o.subject],sep)],
      ['SPECIES｜非人類設定', o.species],
      ['BODY｜身型與比例', o.body],
      ['FACE｜臉型與五官', o.face],
      ['SKIN｜膚色與皮膚', o.skin],
      ['MAKEUP｜妝容', o.makeup],
      ['HAIR & CLOTHING｜髮型與服裝', o.look],
      ['MATERIALS｜材質', o.material],
      ['EXPRESSION｜表情', o.expr],
      ['SITUATION｜情境與事件', o.situation],
      ['POSE & ACTION｜姿勢與動作', act],
      ['SHOT & SCALE｜景別與畫面占比', o.shot],
      ['POV & ANGLE｜敘事視角與觀看角度', o.angle],
      ['COMPOSITION｜構圖', o.comp],
      ['CANVAS｜畫布比例與尺寸', o.ratio],
      ['CAMERA｜鏡頭、運鏡與景深', J([o.lens,J([o.speed,o.move],' ')],sep)],
      ['SCENE｜場景與背景', o.scene],
      ['LIGHTING｜主光與輔光', o.light],
      ['MOOD｜氛圍與情緒敘事', o.mood],
      ['EFFECTS & COLOR｜特效、濾鏡與筆觸', J([o.brush,o.photo,o.tone],sep)],
      ['VIDEO｜時長、節奏與轉場', J([o.duration,o.motionbeat,o.transition],sep)],
      ['CONSISTENCY｜一致性', o.consist],
      ['EDIT｜改圖指示', o.edit],
      ['OUTPUT｜背景與輸出', o.output],
      ['TEXT｜圖上文字', o.text?('"'+o.text+'"'+(o.textstyle?' — '+o.textstyle:'')):''],
      ['QUALITY｜畫質優化', o.quality],
    ].filter(b=>b[1]&&b[1].trim());
    const pos=B.map(b=>'['+b[0]+']\n'+b[1]).join('\n\n');
    const negs=o.neg?o.neg.split(/[、,，]/).map(s=>s.trim()).filter(Boolean).join(', '):'';
    return pos+(negs?('\n\n── NEGATIVE PROMPT｜負面提示詞（貼到獨立欄位）──\n'+negs):'');
  }

  if(tool==='krea'){
    const parts=[o.medium,who,o.species,person,act,o.situation,
      o.scene?(EN()?('in '+o.scene):('位於'+o.scene)):'',
      o.material,o.light,o.mood,o.style,o.brush,o.photo,cam,o.tone,o.output,o.consist];
    return J(parts,sep);
  }

  if(tool==='gpt'){
    const L=[];
    const t=(cn,en)=>EN()?en:cn;
    L.push(EN()?('Create a '+(o.medium||'image')+(o.usage?(' for '+o.usage):'')+'.')
                :('製作一張'+(o.medium||'圖')+(o.usage?('，用途：'+o.usage):'')+'。'));
    if(o.scene)L.push(t('場景：','Scene: ')+o.scene);
    if(o.situation)L.push(t('情境：','Situation: ')+o.situation);
    if(who)L.push(t('角色：','Subject: ')+who);
    if(o.species)L.push(t('非人類設定：','Species: ')+o.species);
    if(person)L.push(t('外觀：','Appearance: ')+person);
    if(act)L.push(t('姿勢與動作：','Pose & action: ')+act);
    if(o.material)L.push(t('材質與質感：','Materials: ')+o.material);
    if(o.text)L.push(EN()?('EXACT TEXT (verbatim, no extra words, no duplicate text):\n  "'+o.text+'"'+(o.textstyle?(' — '+o.textstyle):''))
                          :('文字（照抄，不要多餘文字、不要重複文字）：\n　「'+o.text+'」'+(o.textstyle?(' — '+o.textstyle):'')));
    if(cam)L.push(t('構圖：','Composition: ')+cam);
    const ls=J([o.light,o.style,o.brush,o.photo,o.tone,o.mood],EN()?', ':'、');
    if(ls)L.push(t('光線與風格：','Lighting & style: ')+ls);
    if(o.output)L.push(t('輸出：','Output: ')+o.output);
    if(o.consist)L.push(t('一致性：','Consistency: ')+o.consist);
    if(o.edit)L.push(t('修改指示（改什麼／鎖什麼／連動）：','Edit (change / keep / adjust): ')+o.edit);
    if(o.neg)L.push(EN()?('Constraints: no '+o.neg.split(/[、,，]/).map(s=>s.trim()).filter(Boolean).join(', no ')):('限制：不要'+o.neg));
    return L.join('\n');
  }

  if(tool==='h3'){
    const L=[], d=EN()?'.':'。';
    if(o.duration)L.push(o.duration+d);
    const f=J([who,o.species,act],sep); if(f)L.push(f+d);
    if(o.move)L.push(EN()?('The camera '+J([o.speed,o.move],' ')+(o.shot?(', maintaining a '+o.shot):'')+'.')
                          :('鏡頭'+(o.speed||'')+o.move+(o.shot?('，維持'+o.shot):'')+'。'));
    else if(o.shot)L.push(EN()?('Maintain a '+o.shot+'.'):('維持'+o.shot+'。'));
    if(o.motionbeat)L.push(o.motionbeat+d);
    const e=J([o.situation,o.scene,o.light,o.mood,o.material],sep); if(e)L.push(e+d);
    if(o.transition)L.push((EN()?'Transition: ':'轉場：')+o.transition+d);
    if(o.consist)L.push(o.consist+d);
    return L.join('\n');
  }

  const head=J([o.pony,o.quality],', ');
  const pos=J([head,o.medium,o.count,o.subject,o.look,o.species,person,act,o.situation,o.scene,o.material,o.light,o.mood,
               J([o.shot,o.angle,o.comp,o.lens],', '),o.tone,o.brush,o.photo,o.output,o.consist,o.style?('('+o.style+':1.3)'):''],', ');
  const negs=o.neg?o.neg.split(/[、,，]/).map(s=>s.trim()).filter(Boolean).join(', '):'(填寫上方「負面提示詞」)';
  return pos+'\n\n── 負面提示詞 ──\n'+negs;
}

function render(){
  const out=build(), el=$('result');
  const has=IDS.some(i=>v(i));
  el.textContent=has?out:'開始填左邊的欄位，這裡會即時組出提示詞。';
  el.classList.toggle('empty',!has);
  $('count').textContent=(has?out.length:0)+' 字';
  $('outName').textContent=NAMES[tool];
  $('gLbl').textContent=GUIDE[tool][0]; $('gTxt').textContent=GUIDE[tool][1];
  saveVals();
}
function setTool(k){
  tool=k;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  const dark=matchMedia('(prefers-color-scheme:dark)').matches||document.documentElement.dataset.theme==='dark';
  const C={h3:dark?'#3fb0ae':'#157c7c', sd:dark?'#9c948a':'#5d574f', blocks:dark?'#9c948a':'#5d574f'};
  document.documentElement.style.setProperty('--accent', C[k]||(dark?'#e08b3a':'#b8651a'));
  document.querySelectorAll('.only').forEach(el=>el.classList.toggle('on', k==='blocks'?true:el.classList.contains(k)));
  render();
}

document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.k)));
document.querySelectorAll('#langTabs button').forEach(b=>b.addEventListener('click',()=>{
  if(lang===b.dataset.l)return;

}));

  catch(err){const r=document.createRange();r.selectNodeContents($('result'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='請按 ⌘/Ctrl + C';}
  setTimeout(()=>b.textContent='複製提示詞',1800);
});

function pickR(a){return a[Math.floor(Math.random()*a.length)];}
$('rand').addEventListener('click',()=>{
  const RF=['medium','count','look','situation','scene','light','mood','tone','shot','angle','comp','lens','material','style','brush','photo','expr','pose'];
  CFG.forEach(g=>g.fields.forEach(f=>{
    if(!RF.includes(f.id)||!f.banks||!$(f.id))return;
    const row=pickR(f.banks); if(!row||!row.w||!row.w.length)return;
    const w=norm(pickR(row.w));
    $(f.id).value=(lang==='en'?w.en:w.cn);
  }));
  if($('subject')&&!$('subject').value)$('subject').value=lang==='en'?'a person':'一名人物';
  render();
});
